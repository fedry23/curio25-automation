name: Curio25 — render diario (sin publicar)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Revisar piloto existente o producir un lote nuevo'
        type: choice
        options: [review_pilot, daily]
        default: review_pilot
  schedule:
    - cron: '15 5 * * *'
    # Fallback: una segunda oportunidad si GitHub retrasa/omite el primer cron.
    # Misma fecha de episodio + reserva SQLite/historial: nunca duplicar.
    - cron: '47 8 * * *'
permissions:
  contents: write
concurrency:
  group: curio25-state
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Determinar si hay vídeos programados que conciliar
        id: reconcile_gate
        run: |
          python - <<'PY'
          import json, os
          from curio25.state import production_episode
          with open('config.json') as f: config=json.load(f)
          with open('data/history.json') as f: history=json.load(f)
          needed=bool(config.get('channel_id')) and any(production_episode(e['id']) and e['status']=='scheduled' and e.get('video_id') for e in history['episodes'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'needed={str(needed).lower()}\n')
          PY
      - name: Verificar cola editorial ANTES de instalar y renderizar
        id: preflight
        env:
          CURIO_MODE: ${{ inputs.mode }}
        run: |
          MODE="${CURIO_MODE:-daily}"
          EPISODE="daily-$(TZ=Europe/Madrid date +%F)"
          if [ "$MODE" = "review_pilot" ]; then EPISODE="pilot-001"; fi
          python -m curio25.preflight --mode "$MODE" --episode "$EPISODE"
      - name: Auditar derechos y evidencias antes del render
        if: steps.preflight.outputs.ready == 'true'
        run: python -m curio25.editorial
      - name: Instalar FFmpeg
        if: steps.preflight.outputs.ready == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! test -e /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - name: Instalar dependencias Python
        if: steps.preflight.outputs.ready == 'true' || steps.reconcile_gate.outputs.needed == 'true'
        run: pip install -r requirements.lock
      - name: Conciliar publicaciones sin subir ni modificar vídeos
        if: steps.reconcile_gate.outputs.needed == 'true'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo '::error::No se puede confirmar publicaciones sin OAuth configurado.'
            exit 1
          fi
          python -m curio25 reconcile
      - name: Tests
        if: steps.preflight.outputs.ready == 'true'
        run: pytest -q
      - name: Recuperar modelo de voz verificado desde cache
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: |
            models/es_ES-davefx-medium.onnx
            models/es_ES-davefx-medium.onnx.json
          key: curio25-piper-davefx-medium-d2c9224e122321aa
      - name: Descargar voz y comprobar integridad
        if: steps.preflight.outputs.ready == 'true'
        run: python scripts/download_voice.py
      - name: Renderizar
        if: steps.preflight.outputs.ready == 'true'
        env:
          CURIO_MODE: ${{ inputs.mode }}
          YOUTUBE_ANALYTICS_TOKEN_JSON: ${{ secrets.YOUTUBE_ANALYTICS_TOKEN_JSON }}
        run: |
          if [ "${CURIO_MODE:-daily}" = "review_pilot" ]; then
            python -m curio25 revise --episode pilot-001 --out build/pilot-002 2>&1 | tee render.log
          else
            DAY="$(TZ=Europe/Madrid date +%F)"
            python -m curio25 build --episode "daily-$DAY" --out "build/daily-$DAY" 2>&1 | tee render.log
          fi
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: Conservar historial incluso ante fallo
        if: ${{ always() && (steps.preflight.outputs.ready == 'true' || steps.reconcile_gate.outputs.needed == 'true') }}
        run: |
          if [ -f data/history.json ]; then
            git config user.name 'curio25-bot'
            git config user.email 'curio25-bot@users.noreply.github.com'
            git add data/history.json
            git diff --staged --quiet || git commit -m 'Persistir historial de Curio25'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.preflight.outputs.ready == 'true' }}
        with:
          name: curio25-${{ github.run_id }}
          path: |
            build/**/episode.mp4
            build/**/thumbnail.jpg
            build/**/captions.srt
            build/**/metadata.json
            build/**/description.txt
            build/**/validation.json
            build/**/layout-report.json
            build/**/assets.json
            build/**/script.json
            render.log
          retention-days: 3
      - name: Alerta de fallo
        if: failure()
        run: echo '::error::Curio25 ha fallado. Revisar logs y artefactos. Configura notificaciones de Actions en GitHub.'
