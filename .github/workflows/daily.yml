name: Curio25 — render diario (sin publicar)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Revisar piloto existente o producir un lote nuevo'
        type: choice
        options: [review_pilot, daily]
        default: review_pilot
  schedule:
    - cron: '15 5 * * *'
permissions:
  contents: write
concurrency:
  group: curio25-state
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verificar cola editorial ANTES de instalar y renderizar
        id: preflight
        env:
          CURIO_MODE: ${{ inputs.mode }}
        run: |
          MODE="${CURIO_MODE:-daily}"
          EPISODE="daily-$(date -u +%F)"
          if [ "$MODE" = "review_pilot" ]; then EPISODE="pilot-001"; fi
          python -m curio25.preflight --mode "$MODE" --episode "$EPISODE"
      - name: Auditar derechos y evidencias antes del render
        if: steps.preflight.outputs.ready == 'true'
        run: python -m curio25.editorial
      - name: Instalar FFmpeg
        if: steps.preflight.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Instalar dependencias Python
        if: steps.preflight.outputs.ready == 'true'
        run: pip install -r requirements.lock
      - name: Tests
        if: steps.preflight.outputs.ready == 'true'
        run: pytest -q
      - name: Descargar voz y comprobar integridad
        if: steps.preflight.outputs.ready == 'true'
        run: python scripts/download_voice.py
      - name: Renderizar
        if: steps.preflight.outputs.ready == 'true'
        env:
          CURIO_MODE: ${{ inputs.mode }}
        run: |
          if [ "${CURIO_MODE:-daily}" = "review_pilot" ]; then
            python -m curio25 revise --episode pilot-001 --out build/pilot-002 2>&1 | tee render.log
          else
            python -m curio25 build --episode "daily-$(date -u +%F)" --out "build/daily-$(date -u +%F)" 2>&1 | tee render.log
          fi
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: Conservar historial incluso ante fallo
        if: ${{ always() && steps.preflight.outputs.ready == 'true' }}
        run: |
          if [ -f data/history.json ]; then
            git config user.name 'curio25-bot'
            git config user.email 'curio25-bot@users.noreply.github.com'
            git add data/history.json
            git diff --staged --quiet || git commit -m 'Persistir historial de Curio25'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.preflight.outputs.ready == 'true' }}
        with:
          name: curio25-${{ github.run_id }}
          path: |
            build/**/episode.mp4
            build/**/thumbnail.jpg
            build/**/captions.srt
            build/**/metadata.json
            build/**/description.txt
            build/**/validation.json
            build/**/layout-report.json
            build/**/assets.json
            build/**/script.json
            render.log
          retention-days: 3
      - name: Alerta de fallo
        if: failure()
        run: echo '::error::Curio25 ha fallado. Revisar logs y artefactos. Configura notificaciones de Actions en GitHub.'
