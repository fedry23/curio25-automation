name: Curio25 - Previsualizar segundo episodio (sin publicar)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'curio25/preview.py'
      - 'curio25/captions.py'
      - 'curio25/video_io.py'
      - 'curio25/episode_meta.py'
      - 'data/candidates/2026-11-17.json'
      - 'data/candidates/media-2026-11-17/**'
      - 'curio25/render.py'
      - 'curio25/voice_style.py'
      - 'curio25/branding.py'
      - 'curio25/festive_branding.py'
      - 'curio25/theme.py'
      - 'assets/fonts/**'
      - 'curio25/soundtrack.py'
      - 'curio25/clock.py'
      - 'curio25/art.py'
      - 'curio25/layout.py'
      - 'config.json'
      - '.github/workflows/preview.yml'
permissions:
  contents: read
concurrency:
  group: curio25-draft-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Comprobar FFmpeg y fuentes del runner
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! test -e /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - run: pip install -r requirements.lock
      - name: Auditoría y pruebas de la previsualización
        run: python -m curio25.editorial && python -m pytest -q tests/test_preview.py tests/test_engineering.py
      - name: Mosaico, fotos y metadatos NO aprobados
        run: python -m curio25.preview --contact-only
      - name: Reutilizar voz ya descargada cuando su hash esté aprobado
        uses: actions/cache@v4
        with:
          path: |
            models/es_ES-davefx-medium.onnx
            models/es_ES-davefx-medium.onnx.json
          key: curio25-piper-davefx-medium-d2c9224e122321aa
      - name: Descarga de voz neuronal con SHA256
        run: python scripts/download_voice.py
      - name: Render técnico de 300 segundos sin YouTube
        run: python -m curio25.preview 2>&1 | tee build/review-2026-11-17/render.log
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: Garantizar historial y catálogo intactos
        if: always()
        run: git diff --exit-code -- data/facts.json data/history.json data/media/assets.json config.json
      - name: Guardar MP4, mosaico e informes incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curio25-preview-${{ github.run_id }}
          path: |
            build/review-2026-11-17/contact-sheet.jpg
            build/review-2026-11-17/preview-manifest.json
            build/review-2026-11-17/episode.mp4
            build/review-2026-11-17/captions.srt
            build/review-2026-11-17/validation.json
            build/review-2026-11-17/layout-report.json
            build/review-2026-11-17/clock-report.json
            build/review-2026-11-17/brand-intro.mp4
            build/review-2026-11-17/brand-outro.mp4
            build/review-2026-11-17/intro-preview.png
            build/review-2026-11-17/outro-preview.png
            build/review-2026-11-17/intro-layout.json
            build/review-2026-11-17/outro-layout.json
            build/review-2026-11-17/full-attributions.txt
            build/review-2026-11-17/description.txt
            build/review-2026-11-17/render.log
          retention-days: 7
          if-no-files-found: warn
