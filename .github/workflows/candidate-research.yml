name: Curio25 - Investigar candidatos (sin publicar)
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Fecha del lote
        required: true
        default: "2026-11-17"
  push:
    branches: [main]
    paths:
      - "curio25/research.py"
      - "data/candidates/*.json"
      - ".github/workflows/candidate-research.yml"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: curio25-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - name: Archivar fuentes y buscar imagenes
        id: research
        env:
          CURIO_EPISODE: ${{ inputs.episode }}
        run: |
          EPISODE="${CURIO_EPISODE:-2026-11-17}"
          python -m curio25.research --episode "$EPISODE" --out "build/research-$EPISODE"
          echo "episode=$EPISODE" >> "$GITHUB_OUTPUT"
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curio25-research-${{ github.run_id }}
          path: build/research-*/
          retention-days: 14
      - name: Crear PR de revisión
        if: steps.research.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ steps.research.outputs.episode }}
        run: |
          BRANCH="curio25-research-$EPISODE"
          DEST="data/candidates/research-$EPISODE"
          git config user.name 'curio25-research-bot'
          git config user.email 'curio25-research-bot@users.noreply.github.com'
          git switch -c "$BRANCH"
          mkdir -p "$DEST"
          cp -a "build/research-$EPISODE/." "$DEST/"
          git add "$DEST"
          git diff --cached --quiet && exit 0
          git commit -m "Archivar fuentes candidatas para $EPISODE"
          if git push -u origin "$BRANCH"; then
            gh pr create --base main --head "$BRANCH" --title "Curio25: revisar fuentes e imágenes $EPISODE" \
              --body "Investigación automática, aún sin aprobación editorial ni licencias comprobadas. NO publicar vídeos." || true
          else
            echo "::warning::No se pudo crear rama; consultar artefacto"
          fi
